[project]
name = "yolo-cv-workspace"
version = "0.1.0"
description = "Research workspace for YOLOv11-based sewer defect training pipelines."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.23.0,<2.0.0",
    "matplotlib>=3.3.0",
    "opencv-python>=4.6.0",
    "pillow>=7.1.2",
    "pyyaml>=5.3.1",
    "requests>=2.23.0",
    "scipy>=1.4.1",
    "tqdm>=4.64.0",
    "psutil",
    "py-cpuinfo",
    "pandas>=1.1.4",
    "seaborn>=0.11.0",
    "torch",
    "torchvision",
    "ultralytics-thop>=2.0.0",
    "albumentations>=1.4.6",
    "scikit-learn>=1.8.0",
    "polars>=1.41.2",
]

[project.optional-dependencies]
cu128 = []
dev = [
    "pytest>=8.3.0",
]

[tool.uv]
package = false
default-groups = []

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
pythonpath = ["."]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
