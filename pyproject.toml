[project]
name = "yolo-cv-workspace"
version = "0.1.0"
description = "Research workspace for YOLOv11-based sewer defect training pipelines."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.23.0,<2.0.0",
    "matplotlib>=3.3.0",
    "opencv-python>=4.6.0",
    "pillow>=7.1.2",
    "pyyaml>=5.3.1",
    "requests>=2.23.0",
    "scipy>=1.4.1",
    "tqdm>=4.64.0",
    "psutil",
    "py-cpuinfo",
    "pandas>=1.1.4",
    "seaborn>=0.11.0",
    "ultralytics-thop>=2.0.0",
    "albumentations>=1.4.6",
]

[project.optional-dependencies]
cpu = [
    "torch",
    "torchvision",
]
cu126 = [
    "torch",
    "torchvision",
]
cu128 = [
    "torch",
    "torchvision",
]
dev = [
    "pytest>=8.3.0",
]

[tool.uv]
package = false
default-groups = []
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu126" },
    ],
    [
        { extra = "cpu" },
        { extra = "cu128" },
    ],
    [
        { extra = "cu126" },
        { extra = "cu128" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu128", extra = "cu128" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
